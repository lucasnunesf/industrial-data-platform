services:
  erp-db:
    image: postgres:17
    container_name: erp-db
    environment:
      POSTGRES_USER: ${ERP_DB_USER}
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD}
      POSTGRES_DB: ${ERP_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - erp-data:/var/lib/postgresql/data
      - ./erp/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./erp/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  simulator:
    build: ./simulator
    profiles: ["simulator"]
    depends_on:
      erp-db:
        condition: service_healthy
    environment:
      ERP_DB_HOST: erp-db
      ERP_DB_PORT: "5432"
      ERP_DB_USER: ${ERP_DB_USER}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD}
      ERP_DB_NAME: ${ERP_DB_NAME}

volumes:
  erp-data:
