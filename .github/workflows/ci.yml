name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extraction-tests:
    name: Extraction and simulator tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp_admin
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ERP_DB_HOST: localhost
      ERP_DB_PORT: "5432"
      ERP_DB_USER: erp_admin
      ERP_DB_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ingestion/requirements.txt pytest
      - run: python -m pytest ingestion/tests
      # Separate run: ingestion and simulator both have a module named db.
      - run: python -m pytest simulator/tests

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  dbt-parse:
    name: dbt parse (no warehouse connection)
    runs-on: ubuntu-latest
    env:
      FABRIC_SQL_HOST: ci.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dbt-fabric
      - run: dbt parse --project-dir dbt --profiles-dir dbt
