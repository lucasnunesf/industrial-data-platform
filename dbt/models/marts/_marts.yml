version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_work_center
    columns:
      - name: work_center_id
        data_tests: [unique, not_null]
      - name: hourly_rate_brl
        data_tests: [not_null]

  - name: dim_machine
    columns:
      - name: machine_id
        data_tests: [unique, not_null]
      - name: work_center_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_work_center')
                field: work_center_id

  - name: fct_stage_execution
    columns:
      - name: work_center_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_work_center')
                field: work_center_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: started_at
        data_tests: [not_null]

  - name: fct_order_delivery
    columns:
      - name: sales_order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: sales_order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'in_production', 'shipped', 'cancelled']
      - name: is_on_time
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_overdue
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: fct_order_margin
    columns:
      - name: sales_order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_order_delivery')
                field: sales_order_id
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: usd_brl_rate
        data_tests: [not_null]
      - name: material_cost_brl
        data_tests: [not_null]
      - name: processing_cost_brl
        data_tests: [not_null]
      - name: freight_cost_brl
        data_tests: [not_null]
